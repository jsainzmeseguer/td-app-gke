apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-appgke
spec:
  replicas: 2
  selector:
    matchLabels:
      app: python-appgke
  template:
    metadata:
      labels:
        app: python-appgke
    spec:
      containers:
      - name: python-appgke
        image: us-central1-docker.pkg.dev/lab-8-2-gke/python-apps/python-appgke:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5000


